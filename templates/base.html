<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Finder{% endblock %}</title>
  <style>
    :root { --blue: #2563eb; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --bg: #f5f5f5; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 2rem 1rem; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.12); padding: 1.5rem 2rem; max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0; font-size: 1.4rem; }
    h1 a { color: inherit; text-decoration: none; }
    a { color: var(--blue); }
    button, .btn { padding: .45rem 1rem; font-size: .9rem; border: none; border-radius: 6px; background: var(--blue); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
    button.secondary, .btn.secondary { background: #e5e7eb; color: var(--ink); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, select, textarea { font: inherit; font-size: .9rem; padding: .4rem .5rem; border: 1px solid #d1d5db; border-radius: 6px; }
    .muted { color: var(--muted); font-size: .85rem; }
    .badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 600; background: #e5e7eb; }
    .badge.new { background: #dbeafe; color: #1e40af; }
    .badge.viewed { background: #f3f4f6; color: #374151; }
    .badge.applied { background: #ede9fe; color: #5b21b6; }
    .badge.interview { background: #fef3c7; color: #92400e; }
    .badge.offer { background: #dcfce7; color: #166534; }
    .badge.rejected, .badge.withdrawn { background: #fee2e2; color: #991b1b; }
    .badge.ghosted { background: #e5e7eb; color: #4b5563; }
    .badge.hidden { background: #f3f4f6; color: #9ca3af; }
    pre { background: #1e1e1e; color: #d4d4d4; border-radius: 6px; padding: 1rem; font-size: .78rem; max-height: 320px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
